    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="打开导航菜单"
    >
      <span class="menu-line"></span>
    </button>

  </div>
</header>

<main>

  <section class="custom-page-head">
    <div class="container">

      <div class="breadcrumb">
        <a href="index.html">首页</a>
        <span>/</span>
        <span>定制类产品设计</span>
      </div>

      <div class="custom-head-grid">

        <h1 class="custom-page-title">
          定制类产品设计
        </h1>

        <p class="custom-page-intro">
          按照产品用途分为鞋类、化妆包、服装和帽子与配饰。
          各分类中的产品根据销量由高到低排列，
          点击产品可在当前页面查看详细信息。
        </p>

      </div>
    </div>
  </section>

  <section class="custom-products-section">
    <div class="container">

      <div
        class="custom-filter"
        role="tablist"
        aria-label="产品分类"
      >
        <button
          class="custom-filter-button active"
          type="button"
          role="tab"
          aria-selected="true"
          data-category="鞋类"
        >
          鞋类
        </button>

        <button
          class="custom-filter-button"
          type="button"
          role="tab"
          aria-selected="false"
          data-category="化妆包"
        >
          化妆包
        </button>

        <button
          class="custom-filter-button"
          type="button"
          role="tab"
          aria-selected="false"
          data-category="服装"
        >
          服装
        </button>

        <button
          class="custom-filter-button"
          type="button"
          role="tab"
          aria-selected="false"
          data-category="帽子与配饰"
        >
          帽子与配饰
        </button>
      </div>

      <div
        class="custom-product-grid"
        id="customProductGrid"
      ></div>

      <div
        class="products-empty"
        id="customProductsEmpty"
        hidden
      >
        该分类的产品正在整理中。
      </div>

    </div>
  </section>

</main>
