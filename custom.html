<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="小船小船-定制类产品设计作品"
  >
  <title>定制类产品设计｜小船小船-</title>
  <link
    rel="stylesheet"
    href="styles.css?v=20260801-white-background-meta-v1"
  >
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <a class="header-brand" href="index.html">
      <strong>小船小船-</strong>
      <span>PORTFOLIO</span>
    </a>

    <nav class="site-nav" id="siteNav">
      <a href="custom.html" aria-current="page">
        定制类产品设计
      </a>
      <a href="visual.html">
        平面视觉
      </a>
      <a href="index.html#home-about">
        关于我
      </a>
    </nav>

    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="打开导航菜单"
    >
      <span class="menu-line"></span>
    </button>

  </div>
</header>

<main>

  <section class="custom-page-head">
    <div class="container">

      <div class="breadcrumb">
        <a href="index.html">首页</a>
        <span>/</span>
        <span>定制类产品设计</span>
      </div>

      <div class="custom-head-grid">

        <h1 class="custom-page-title">
          定制类产品设计
        </h1>

        <p class="custom-page-intro">
          按照产品用途分为鞋类、化妆包、服装和帽子与配饰。
          各分类中的产品根据销量由高到低排列，
          点击产品可在当前页面查看详细信息。
        </p>

      </div>
    </div>
  </section>

  <section class="custom-products-section">
    <div class="container">

      <div
        class="custom-filter"
        role="tablist"
        aria-label="产品分类"
      >
        <button
          class="custom-filter-button active"
          type="button"
          role="tab"
          aria-selected="true"
          data-category="鞋类"
        >
          鞋类
        </button>

        <button
          class="custom-filter-button"
          type="button"
          role="tab"
          aria-selected="false"
          data-category="化妆包"
        >
          化妆包
        </button>

        <button
          class="custom-filter-button"
          type="button"
          role="tab"
          aria-selected="false"
          data-category="服装"
        >
          服装
        </button>

        <button
          class="custom-filter-button"
          type="button"
          role="tab"
          aria-selected="false"
          data-category="帽子与配饰"
        >
          帽子与配饰
        </button>
      </div>

      <div
        class="custom-product-grid"
        id="customProductGrid"
      ></div>

      <div
        class="products-empty"
        id="customProductsEmpty"
        hidden
      >
        该分类的产品正在整理中。
      </div>

    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>
      © <span id="currentYear"></span>
      小船小船- PORTFOLIO
    </span>
    <span>
      BUILT WITH GITHUB PAGES
    </span>
  </div>
</footer>

<script src="script.js?v=20260801-modal-v2"></script>
<script src="products-data.js?v=20260801-modal-v2"></script>
<script src="products-ui.js?v=20260801-home-layout-v2"></script>

</body>
</html>
